<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ecosystem Map{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ url_for('index') }}">Ecosystem Map</a>
  <nav>
    <a href="{{ url_for('index') }}">Directory</a>
    <a href="{{ url_for('graph') }}">Graph</a>
    <a href="{{ url_for('submit') }}">Submit</a>
    <a href="{{ url_for('admin') }}">Admin</a>
    <a href="{{ url_for('admin_relationships') }}">Relationships</a>
    <a href="{{ url_for('export_entities_csv') }}">CSV</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>
  Prototype: relationship-first community asset discovery. Public pages show only approved public records.
</footer>
</body>
</html>
